            <div className="swatches-header">
              <span className="swatches-count">Suggestions ({swatches.length})</span>
              <span className="swatches-hint">Click + to add to palette</span>
            </div>

            <div className="swatches-grid">
              {swatches.map(swatch => {
                const isLight = isLightColor(swatch.hex);
                const isCopied = copiedHex === swatch.hex;
                const isAdded = recentlyAddedId === swatch.id;

                return (
                  <div
                    key={swatch.id}
                    className="generator-swatch-card"
                    style={{ backgroundColor: swatch.hex }}
                  >
                    <div className={`swatch-card-content ${isLight ? "dark-text" : "light-text"}`}>
                      <div className="swatch-top-info">
                        <span className="swatch-rule-tag">{swatch.rule}</span>
                      </div>

                      <div className="swatch-bottom-info">
                        <button
                          type="button"
                          className="swatch-hex-btn font-mono"
                          onClick={(e) => handleCopy(swatch.hex, e)}
                          title={`Copy ${swatch.hex}`}
                        >
                          {isCopied ? (
                            <span className="copied-label"><CheckIcon size={12} /> Copied</span>
                          ) : (
                            <span className="hex-label">{swatch.hex}</span>
                          )}
                        </button>

                        <button
                          type="button"
                          className={`swatch-add-btn ${isAdded ? "added" : ""}`}
                          onClick={(e) => handleAdd(swatch, e)}
                          title={`Add ${swatch.hex} to palette`}
                          aria-label={`Add ${swatch.hex} to palette`}
                        >
                          {isAdded ? (
                            <>
                              <CheckIcon size={13} />
                              <span className="btn-label">Added</span>
                            </>
                          ) : (
                            <>
                              <PlusIcon size={13} />
                              <span className="btn-label">Add</span>
                            </>
                          )}
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="sidebar-footer">
            <p className="sidebar-footer-tip">
              💡 <strong>Tip:</strong> Need to fix failing contrast? Choose <strong>Light</strong> or <strong>Dark</strong> to find accessible pair colors.
            </p>
          </div>
        </aside>
      );
    }

    // ==========================================
    // 7. TAB A: PALETTE MANAGER COMPONENT (High-Contrast Index Tags)
    // ==========================================
    function PaletteManager({
      palette,
      onAddColor,
      onRemoveColor,
      onUpdateColor,
      onReorderColor,
      onLoadPreset,
      onClearPalette
    }) {
      const [inputHex, setInputHex] = useState("#307CFF");
      const [pickerHex, setPickerHex] = useState("#307CFF");
      const [copiedKey, setCopiedKey] = useState(null);
      const [inputError, setInputError] = useState("");

      const handleInputChange = (e) => {
        const val = e.target.value;
        setInputHex(val);
        if (val.trim() === "") {
          setInputError("");
          return;
        }
        const normalized = normalizeHex(val);
        if (normalized) {
          setPickerHex(normalized);
          setInputError("");
        } else {
          setInputError("Invalid hex code");
        }
      };

      const handlePickerChange = (e) => {
        const val = e.target.value.toUpperCase();
        setPickerHex(val);
        setInputHex(val);
        setInputError("");
      };

      const handleAdd = (e) => {
        e.preventDefault();
        const normalized = normalizeHex(inputHex);
        if (!normalized) {
          setInputError("Please enter a valid 3 or 6 digit hex color (e.g. #307CFF)");
          return;
        }
        onAddColor(normalized);
        setInputError("");
      };

      const handleCopyText = (text, key) => {
        navigator.clipboard?.writeText(text);
        setCopiedKey(key);
        setTimeout(() => setCopiedKey(null), 1500);
      };

      return (
        <div className="palette-view-container" id="panel-palette" role="tabpanel" aria-labelledby="tab-palette">
          <section className="palette-input-section" aria-label="Add New Color">
            <form className="palette-input-form" onSubmit={handleAdd}>
              <div className="input-group">
                <div className="color-preview-trigger" style={{ backgroundColor: isValidHex(inputHex) ? (normalizeHex(inputHex) || "#FFFFFF") : "#E2E8F0" }}>
                  <input
                    type="color"
                    className="native-color-input"
                    value={isValidHex(inputHex) ? (normalizeHex(inputHex) || "#307CFF") : "#307CFF"}
                    onChange={handlePickerChange}
                    aria-label="Pick color visually"
                    title="Click to open color picker"
                  />
                </div>
                
                <div className="hex-input-wrap">
                  <span className="hex-prefix">#</span>
                  <input
                    type="text"
                    className={`hex-text-input font-mono ${inputError ? "input-has-error" : ""}`}
                    value={inputHex.replace(/^#/, "")}
                    onChange={(e) => handleInputChange({ target: { value: "#" + e.target.value } })}
                    placeholder="307CFF"
                    maxLength={7}
                    aria-label="Hex color value"
                  />
                </div>

                <button
                  type="submit"
                  className="primary-add-btn"
                  disabled={!isValidHex(inputHex)}
                >
                  <PlusIcon size={15} />
                  <span>Add to Palette</span>
                </button>
              </div>

              {inputError && (
                <div className="input-error-msg" role="alert">{inputError}</div>
              )}
            </form>

            <div className="presets-bar">
              <span className="presets-title">Starter Presets:</span>
              <div className="preset-buttons">
                {STARTER_PRESETS.map((preset, idx) => (
                  <button
                    key={idx}
                    type="button"
                    className="preset-btn"
                    onClick={() => onLoadPreset(preset.colors)}
                    title={`Load ${preset.name} palette`}
                  >
                    <div className="preset-dots">
                      {preset.colors.slice(0, 4).map((c, i) => (
                        <span key={i} className="preset-dot" style={{ backgroundColor: c }} />
                      ))}
                    </div>
                    <span>{preset.name}</span>
                  </button>
                ))}

                {palette.length > 0 && (
                  <button
                    type="button"
                    className="clear-palette-btn"
                    onClick={onClearPalette}
                    title="Clear all colors in palette"
                  >
                    Clear All
                  </button>
                )}
              </div>
            </div>
          </section>

          <section className="palette-grid-section" aria-label="Palette Color Cards">
            <div className="section-header-row">
              <div>
                <h2 className="section-heading">Active Palette</h2>
                <p className="section-subheading">
                  {palette.length} {palette.length === 1 ? "color" : "colors"} in your design system
                </p>
              </div>
              {palette.length >= 2 && (
                <div className="reorder-tip">
                  <span>Use arrows to reorder colors</span>
                </div>
              )}
            </div>

            {palette.length === 0 ? (
              <div className="empty-palette-card">
                <div className="empty-icon-wrap">
                  <LayersIcon size={24} />
                </div>
                <h3 className="empty-title">Your palette is currently empty</h3>
                <p className="empty-desc">
                  Add colors using the input bar above, generate harmonious tones from the left sidebar, or load one of our curated design system presets.
                </p>
                <div className="empty-actions">
                  <button
                    type="button"
                    className="load-starter-cta"
                    onClick={() => onLoadPreset(STARTER_PRESETS[0].colors)}
                  >
                    <SparklesIcon size={15} />
                    <span>Load Antigravity Starter Set</span>
                  </button>
                </div>
              </div>
            ) : (
              <div className="palette-cards-grid">
                {palette.map((item, index) => {
                  const hex = item.hex;
                  const rgb = hexToRgb(hex);
                  const rgbStr = formatRgb(rgb);
                  const luminance = getRelativeLuminance(rgb.r, rgb.g, rgb.b);
                  const isLight = isLightColor(hex);

                  return (
                    <div
                      key={item.id || `${hex}-${index}`}
                      className="palette-color-card"
                    >
                      <div
                        className="palette-swatch-box"
                        style={{ backgroundColor: hex }}
                      >
                        <div className="card-top-overlay">
                          <div className="card-reorder-controls">
                            <button
                              type="button"
                              className="card-action-icon-btn"
                              disabled={index === 0}
                              onClick={() => onReorderColor(index, index - 1)}
                              title="Move earlier in palette"
                              aria-label="Move earlier"
                            >
                              <ArrowUpIcon size={13} />
                            </button>
                            <button
                              type="button"
                              className="card-action-icon-btn"
                              disabled={index === palette.length - 1}
                              onClick={() => onReorderColor(index, index + 1)}
                              title="Move later in palette"
                              aria-label="Move later"
                            >
                              <ArrowDownIcon size={13} />
                            </button>
                          </div>

                          <div className="card-right-controls">
                            <label className="card-picker-label" title="Change this color">
                              <input
                                type="color"
                                className="card-hidden-picker"
                                value={hex}
                                onChange={(e) => onUpdateColor(index, e.target.value.toUpperCase())}
                              />
                              <span className="card-picker-badge">Edit</span>
                            </label>

                            <button
                              type="button"
                              className="card-action-icon-btn delete-btn"
                              onClick={() => onRemoveColor(index)}
                              title={`Remove ${hex} from palette`}
                              aria-label={`Remove ${hex}`}
                            >
                              <TrashIcon size={13} />
                            </button>
                          </div>
                        </div>

                        {/* High-contrast order label */}
                        <div className={`swatch-center-label ${isLight ? "dark-badge" : "light-badge"}`}>
                          <span className="swatch-index-tag">#{index + 1}</span>
                        </div>
                      </div>

                      <div className="palette-card-footer">
                        <div className="color-code-row">
                          <button
                            type="button"
                            className="copyable-code-btn"
                            onClick={() => handleCopyText(hex, `hex-${index}`)}
                            title="Click to copy HEX"
                          >
                            <span className="code-label">HEX</span>
                            <span className="code-value font-mono">{hex}</span>
                            {copiedKey === `hex-${index}` ? (
                              <CheckIcon size={13} className="text-success" />
                            ) : (
                              <CopyIcon size={13} className="text-muted" />
                            )}
                          </button>
                        </div>

                        <div className="color-code-row">
                          <button
                            type="button"
                            className="copyable-code-btn"
                            onClick={() => handleCopyText(rgbStr, `rgb-${index}`)}
                            title="Click to copy RGB"
                          >
                            <span className="code-label">RGB</span>
                            <span className="code-value font-mono">{rgbStr}</span>
                            {copiedKey === `rgb-${index}` ? (
                              <CheckIcon size={13} className="text-success" />
                            ) : (
                              <CopyIcon size={13} className="text-muted" />
                            )}
                          </button>
                        </div>

                        <div className="color-meta-row">
                          <span className="meta-label">Luminance</span>
                          <span className="meta-value font-mono">{luminance.toFixed(3)}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        </div>
      );
    }

    // ==========================================
    // 8. TAB B: CONTRAST CHECKER COMPONENT (TEXT label & Interactive Preview Button)
    // ==========================================
    function InteractivePreviewButton({ bgHex, fgHex }) {
      const [isHovered, setIsHovered] = useState(false);
      const [isPressed, setIsPressed] = useState(false);

      const style = {
        backgroundColor: isHovered ? fgHex : "transparent",
        color: isHovered ? bgHex : fgHex,
        border: "none",
        outline: "1px solid " + fgHex,
        opacity: isPressed ? 0.75 : 1,
        transform: isPressed ? "scale(0.97)" : isHovered ? "translateY(-1px)" : "none",
        transition: "all 0.15s cubic-bezier(0.16, 1, 0.3, 1)",
        cursor: "pointer",
        userSelect: "none"
      };

      return (
        <button
          type="button"
          className="sample-pill-btn"
          style={style}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => {
            setIsHovered(false);
            setIsPressed(false);
          }}
          onMouseDown={() => setIsPressed(true)}
          onMouseUp={() => setIsPressed(false)}
          title="Hover or click to preview active/hover states"
        >
          Interactive Button Preview
        </button>
      );
    }

    function ContrastChecker({
      snapshotPalette,
      isStale,
      onRefresh,
      onSwitchToPalette
    }) {
      const [filterMode, setFilterMode] = useState("all");
      const [sortMode, setSortMode] = useState("default");
      const [isRefreshing, setIsRefreshing] = useState(false);

      const handleRefreshClick = () => {
        setIsRefreshing(true);
        onRefresh();
        setTimeout(() => setIsRefreshing(false), 400);
      };

      const contrastPairs = useMemo(() => {
        if (!snapshotPalette || snapshotPalette.length < 2) return [];

        const pairs = [];
        for (let i = 0; i < snapshotPalette.length; i++) {
          for (let j = 0; j < snapshotPalette.length; j++) {
            if (i !== j) {
              const bg = snapshotPalette[i].hex;
              const fg = snapshotPalette[j].hex;
              const ratio = getContrastRatio(fg, bg);
              const wcag = evaluateWCAG(ratio);

              pairs.push({
                id: `pair-${i}-${j}-${bg}-${fg}`,
                bgHex: bg,
                fgHex: fg,
                bgIndex: i + 1,
                fgIndex: j + 1,
                bgRgb: formatRgb(hexToRgb(bg)),
                fgRgb: formatRgb(hexToRgb(fg)),
                ratio,
                wcag
              });
            }
          }
        }
        return pairs;
      }, [snapshotPalette]);

      const filteredPairs = useMemo(() => {
        let result = [...contrastPairs];

        if (filterMode === "failing") {
          result = result.filter(p => !p.wcag.aaNormal);
        } else if (filterMode === "passing") {
          result = result.filter(p => p.wcag.aaNormal);
        } else if (filterMode === "aaa") {
          result = result.filter(p => p.wcag.aaaNormal);
        }

        if (sortMode === "lowest") {
          result.sort((a, b) => a.ratio - b.ratio);
        } else if (sortMode === "highest") {
          result.sort((a, b) => b.ratio - a.ratio);
        }

        return result;
      }, [contrastPairs, filterMode, sortMode]);

      const totalCount = contrastPairs.length;
      const passingAaCount = contrastPairs.filter(p => p.wcag.aaNormal).length;
      const passingAaaCount = contrastPairs.filter(p => p.wcag.aaaNormal).length;
      const passRate = totalCount > 0 ? Math.round((passingAaCount / totalCount) * 100) : 0;

      return (
        <div className="contrast-view-container" id="panel-contrast" role="tabpanel" aria-labelledby="tab-contrast">
          {isStale && (
            <div className="stale-notification-banner" role="alert">
              <div className="stale-banner-left">
                <AlertCircleIcon size={18} className="text-warning" />
                <div>
                  <strong className="stale-title">Your palette has changed</strong>
                  <p className="stale-desc">The contrast results below reflect your previous snapshot. Refresh to test your updated colors.</p>
                </div>
              </div>
              <button
                type="button"
                className="stale-refresh-btn"
                onClick={handleRefreshClick}
              >
                <RefreshIcon size={14} spinning={isRefreshing} />
                <span>Refresh Results</span>
              </button>
            </div>
          )}

          <section className="contrast-top-bar" aria-label="Contrast Controls">
            <div className="contrast-header-main">
              <div>
                <h2 className="section-heading">WCAG Contrast Matrix</h2>
                <p className="section-subheading">
                  Testing all directional combinations (Background vs. Text) for compliance
                </p>
              </div>

              <button
                type="button"
                className={`manual-refresh-btn ${isRefreshing ? "refreshing" : ""}`}
                onClick={handleRefreshClick}
                title="Recompute contrast pairs from current palette"
              >
                <RefreshIcon size={15} spinning={isRefreshing} />
                <span>Refresh Checker</span>
              </button>
            </div>

            {totalCount > 0 && (
              <div className="contrast-stats-grid">
                <div className="stat-card">
                  <span className="stat-label">Total Combinations</span>
                  <span className="stat-number font-mono">{totalCount}</span>
                </div>
                <div className="stat-card">
                  <span className="stat-label">WCAG AA Pass Rate</span>
                  <span className={`stat-number font-mono ${passRate >= 70 ? "text-success" : passRate >= 40 ? "text-warning" : "text-danger"}`}>
                    {passRate}%
                  </span>
                  <span className="stat-sub">{passingAaCount} of {totalCount} pairs</span>
                </div>
                <div className="stat-card">
                  <span className="stat-label">WCAG AAA Passing</span>
                  <span className="stat-number font-mono text-accent">{passingAaaCount}</span>
                  <span className="stat-sub">Strict compliance (≥ 7:1)</span>
                </div>
              </div>
            )}

            {totalCount > 0 && (
              <div className="contrast-filters-row">
                <div className="filter-chips-group" role="group" aria-label="Filter Pairs">
                  <button
                    type="button"
                    className={`filter-pill ${filterMode === "all" ? "active" : ""}`}
                    onClick={() => setFilterMode("all")}
                  >
                    All Pairs ({totalCount})
                  </button>
                  <button
                    type="button"
                    className={`filter-pill fail-pill ${filterMode === "failing" ? "active" : ""}`}
                    onClick={() => setFilterMode("failing")}
                  >
                    <CrossIcon size={13} />
                    Failing AA ({totalCount - passingAaCount})
                  </button>
                  <button
                    type="button"
                    className={`filter-pill pass-pill ${filterMode === "passing" ? "active" : ""}`}
                    onClick={() => setFilterMode("passing")}
                  >
                    <CheckIcon size={13} />
                    Passing AA ({passingAaCount})
                  </button>
                  <button
                    type="button"
                    className={`filter-pill aaa-pill ${filterMode === "aaa" ? "active" : ""}`}
                    onClick={() => setFilterMode("aaa")}
                  >
                    AAA Perfect ({passingAaaCount})
                  </button>
                </div>

                <div className="sort-controls">
                  <label htmlFor="contrast-sort" className="sort-label">Sort by:</label>
                  <select
                    id="contrast-sort"
                    className="sort-select"
                    value={sortMode}
                    onChange={(e) => setSortMode(e.target.value)}
                  >
                    <option value="default">Palette Order</option>
                    <option value="lowest">Lowest Ratio (Fix first)</option>
                    <option value="highest">Highest Ratio First</option>
                  </select>
                </div>
              </div>
            )}
          </section>

          <section className="contrast-list-section" aria-label="Contrast Pairs Results">
            {(!snapshotPalette || snapshotPalette.length < 2) ? (
              <div className="contrast-empty-card">
                <div className="empty-icon-wrap">
                  <EyeIcon size={22} />
                </div>
                <h3 className="empty-title">Need at least 2 colors to check contrast</h3>
                <p className="empty-desc">
                  Your snapshot currently has {snapshotPalette ? snapshotPalette.length : 0} color(s). Add at least two colors to your palette and click Refresh to test every combination.
                </p>
                <button
                  type="button"
                  className="load-starter-cta"
                  onClick={onSwitchToPalette}
                >
                  <SparklesIcon size={15} />
                  <span>Go to Color Palette</span>
                </button>
              </div>
            ) : filteredPairs.length === 0 ? (
              <div className="no-filter-results">
                <p>No contrast pairs match the selected filter.</p>
                <button
                  type="button"
                  className="reset-filter-btn"
                  onClick={() => setFilterMode("all")}
                >
                  Show All Pairs
                </button>
              </div>
            ) : (
              <div className="contrast-pairs-list">
                {filteredPairs.map((pair) => {
                  const { wcag } = pair;

                  return (
                    <article key={pair.id} className="contrast-card">
                      <div className="contrast-card-meta">
                        <div className="color-pair-identifiers">
                          <div className="color-id-item">
                            <span className="id-label">BACKGROUND</span>
                            <div className="id-swatch-wrap">
                              <span
                                className="id-color-dot"
                                style={{ backgroundColor: pair.bgHex }}
                              />
                              <span className="id-hex font-mono">{pair.bgHex}</span>
                            </div>
                          </div>

                          <div className="color-id-separator">vs</div>

                          <div className="color-id-item">
                            <span className="id-label">TEXT</span>
                            <div className="id-swatch-wrap">
                              <span
                                className="id-color-dot"
                                style={{ backgroundColor: pair.fgHex }}
                              />
                              <span className="id-hex font-mono">{pair.fgHex}</span>
                            </div>
                          </div>
                        </div>

                        <div className="contrast-ratio-block">
                          <div className="ratio-header">
                            <span className="ratio-label">Contrast Ratio</span>
                            <span
                              className={`ratio-prominent-badge font-mono ${
                                wcag.aaNormal ? "badge-pass" : "badge-fail"
                              }`}
                            >
                              {wcag.formattedRatio}
                            </span>
                          </div>
                        </div>

                        <div className="wcag-thresholds-matrix">
                          <div className={`threshold-badge ${wcag.aaNormal ? "pass" : "fail"}`}>
                            <div className="threshold-icon">
                              {wcag.aaNormal ? <CheckIcon size={13} /> : <CrossIcon size={13} />}
                            </div>
                            <div className="threshold-info">
                              <span className="threshold-title">AA Normal Text</span>
                              <span className="threshold-spec font-mono">≥ 4.5:1</span>
                            </div>
                            <span className="threshold-status">{wcag.aaNormal ? "PASS" : "FAIL"}</span>
                          </div>

                          <div className={`threshold-badge ${wcag.aaLarge ? "pass" : "fail"}`}>
                            <div className="threshold-icon">
                              {wcag.aaLarge ? <CheckIcon size={13} /> : <CrossIcon size={13} />}
                            </div>
                            <div className="threshold-info">
                              <span className="threshold-title">AA Large Text</span>
                              <span className="threshold-spec font-mono">≥ 3.0:1</span>
                            </div>
                            <span className="threshold-status">{wcag.aaLarge ? "PASS" : "FAIL"}</span>
                          </div>

                          <div className={`threshold-badge ${wcag.aaaNormal ? "pass" : "fail"}`}>
                            <div className="threshold-icon">
                              {wcag.aaaNormal ? <CheckIcon size={13} /> : <CrossIcon size={13} />}
                            </div>
                            <div className="threshold-info">
                              <span className="threshold-title">AAA Normal Text</span>
                              <span className="threshold-spec font-mono">≥ 7.0:1</span>
                            </div>
                            <span className="threshold-status">{wcag.aaaNormal ? "PASS" : "FAIL"}</span>
                          </div>

                          <div className={`threshold-badge ${wcag.aaaLarge ? "pass" : "fail"}`}>
                            <div className="threshold-icon">
                              {wcag.aaaLarge ? <CheckIcon size={13} /> : <CrossIcon size={13} />}
                            </div>
                            <div className="threshold-info">
                              <span className="threshold-title">AAA Large Text</span>
                              <span className="threshold-spec font-mono">≥ 4.5:1</span>
                            </div>
                            <span className="threshold-status">{wcag.aaaLarge ? "PASS" : "FAIL"}</span>
                          </div>
                        </div>
                      </div>

                      <div
                        className="contrast-live-preview-box"
                        style={{ backgroundColor: pair.bgHex, color: pair.fgHex }}
                      >
                        <div className="preview-content">
                          <p className="sample-sentence-large">
                            The quick brown fox jumps over the lazy dog
                          </p>
                          <p className="sample-sentence-normal">
                            The quick brown fox jumps over the lazy dog. 1234567890 &amp; @#$
                          </p>
                          <div className="sample-ui-elements">
                            <InteractivePreviewButton bgHex={pair.bgHex} fgHex={pair.fgHex} />
                            <span className="sample-caption-text">
                              Sample caption (12px text)
                            </span>
                          </div>
                        </div>

                        <div className="preview-footer-tag">
                          <span>Live Render ({pair.fgHex} on {pair.bgHex})</span>
                        </div>
                      </div>
                    </article>
                  );
                })}
              </div>
            )}
          </section>
        </div>
      );
    }

    // ==========================================
    // 9. ROOT APP COMPONENT
    // ==========================================
    function arePalettesDifferent(p1, p2) {
      if (!p1 || !p2) return true;
      if (p1.length !== p2.length) return true;
      for (let i = 0; i < p1.length; i++) {
        if (normalizeHex(p1[i].hex) !== normalizeHex(p2[i].hex)) {
          return true;
        }
      }
      return false;
    }

    function App() {
      const [activeTab, setActiveTab] = useState(TABS.PALETTE);
      const [palette, setPalette] = useState(DEFAULT_PALETTE);
      const [snapshotPalette, setSnapshotPalette] = useState(DEFAULT_PALETTE);

      const isStale = useMemo(() => {
        return arePalettesDifferent(palette, snapshotPalette);
      }, [palette, snapshotPalette]);

      const handleAddColor = useCallback((hex) => {
        const normalized = normalizeHex(hex);
        if (!normalized) return;
        setPalette((prev) => [
          ...prev,
          {
            id: `col-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
            hex: normalized,
            name: `Color ${prev.length + 1}`
          }
        ]);
      }, []);

      const handleRemoveColor = useCallback((index) => {
        setPalette((prev) => prev.filter((_, idx) => idx !== index));
      }, []);

      const handleUpdateColor = useCallback((index, newHex) => {
        const normalized = normalizeHex(newHex);
        if (!normalized) return;
        setPalette((prev) => {
          const copy = [...prev];
          copy[index] = { ...copy[index], hex: normalized };
          return copy;
        });
      }, []);

      const handleReorderColor = useCallback((fromIndex, toIndex) => {
        setPalette((prev) => {
          if (toIndex < 0 || toIndex >= prev.length) return prev;
          const copy = [...prev];
          const [movedItem] = copy.splice(fromIndex, 1);
          copy.splice(toIndex, 0, movedItem);
          return copy;
        });
      }, []);

      const handleLoadPreset = useCallback((colorHexes) => {
        const newItems = colorHexes.map((hex, idx) => ({
          id: `preset-${Date.now()}-${idx}`,
          hex: normalizeHex(hex) || "#307CFF",
          name: `Preset ${idx + 1}`
        }));
        setPalette(newItems);
      }, []);

      const handleClearPalette = useCallback(() => {
        setPalette([]);
      }, []);

      const handleRefreshSnapshot = useCallback(() => {
        setSnapshotPalette([...palette]);
      }, [palette]);

      return (
        <div className="app-layout">
          <Header
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            paletteCount={palette.length}
            isStale={isStale}
          />

          <div className="app-body">
            <SidebarGenerator
              palette={palette}
              onAddColor={handleAddColor}
            />

            <main className="main-content-area" role="main">
              {activeTab === TABS.PALETTE ? (
                <PaletteManager
                  palette={palette}
                  onAddColor={handleAddColor}
                  onRemoveColor={handleRemoveColor}
                  onUpdateColor={handleUpdateColor}
                  onReorderColor={handleReorderColor}
                  onLoadPreset={handleLoadPreset}
                  onClearPalette={handleClearPalette}
                />
              ) : (
                <ContrastChecker
                  snapshotPalette={snapshotPalette}
                  isStale={isStale}
                  onRefresh={handleRefreshSnapshot}
                  onSwitchToPalette={() => setActiveTab(TABS.PALETTE)}
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
